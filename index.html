<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Video</title>

  <style>
    body {
      margin: 0;
      background: black;
      overflow: hidden;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .container {
      position: relative;
      width: 100%;
      height: 100%;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: contain; /* change to cover if you want full bleed */
      background: black;
    }

    /* Overlay for sound activation */
    #overlay {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.35);
      color: white;
      font-size: 22px;
      font-family: sans-serif;
      text-align: center;
      cursor: pointer;
      user-select: none;
    }

    #overlay.hidden {
      display: none;
    }
  </style>
</head>

<body>

  <div class="container">
    <video autoplay muted playsinline preload="auto">
      <source src="video.mp4" type="video/mp4" />
    </video>

    <div id="overlay">
      Tap to enable sound 🔊
    </div>
  </div>

  <script>
    const video = document.querySelector("video");
    const overlay = document.getElementById("overlay");

    // Try autoplay (muted)
    window.addEventListener("load", () => {
      video.play().catch(() => {});
    });

    // Enable sound on user interaction
    overlay.addEventListener("click", () => {
      video.muted = false;
      video.play();
      overlay.classList.add("hidden");
    });

    // Extra iOS fallback
    document.addEventListener("touchstart", () => {
      video.play().catch(() => {});
    }, { once: true });
  </script>

</body>
</html>
