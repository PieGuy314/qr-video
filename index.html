<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Video</title>

  <style>
    body {
      margin: 0;
      background: black;
      height: 100vh;
      overflow: hidden;
      font-family: sans-serif;
    }

    .container {
      position: relative;
      width: 100%;
      height: 100vh;
      background: black;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: none; /* 🔥 hidden until user taps */
      background: black;
    }

    #overlay {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;

      background: rgba(0, 0, 0, 0.75);
      color: white;
      font-size: 24px;
      text-align: center;

      cursor: pointer;
      user-select: none;
      z-index: 9999;
    }

    #overlay.hidden {
      display: none;
    }
  </style>
</head>

<body>

  <div class="container">

    <video playsinline controls>
      <source src="video.mp4" type="video/mp4" />
    </video>

    <div id="overlay">
      Tap to play video ▶️
    </div>

  </div>

  <script>
    const video = document.querySelector("video");
    const overlay = document.getElementById("overlay");

    overlay.addEventListener("click", async () => {
      overlay.classList.add("hidden");

      video.style.display = "block";

      try {
        await video.play();
      } catch (e) {
        console.log("Playback failed:", e);
      }
    });
  </script>

</body>
</html>
