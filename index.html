<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Video</title>

  <style>
    body {
      margin: 0;
      background: black;
      overflow: hidden;
      height: 100vh;
    }

    .container {
      position: relative;
      width: 100%;
      height: 100vh;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: black;
      display: block;
    }

    /* IMPORTANT: force overlay above video */
    #overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;

      display: flex;
      align-items: center;
      justify-content: center;

      background: rgba(0, 0, 0, 0.55);
      color: white;
      font-size: 24px;
      font-family: sans-serif;

      cursor: pointer;
      user-select: none;

      z-index: 9999; /* 🔥 this fixes the visibility issue */
    }

    #overlay.hidden {
      display: none;
    }
  </style>
</head>

<body>

  <div class="container">

    <video autoplay muted playsinline preload="auto">
      <source src="video.mp4" type="video/mp4" />
    </video>

    <div id="overlay">
      Tap to enable sound 🔊
    </div>

  </div>

  <script>
    const video = document.querySelector("video");
    const overlay = document.getElementById("overlay");

    window.addEventListener("load", () => {
      video.play().catch(() => {});
    });

    overlay.addEventListener("click", () => {
      video.muted = false;
      video.play();
      overlay.classList.add("hidden");
    });
  </script>

</body>
</html>
